name: SedePulso - observación privada del piloto

on:
  schedule:
    - cron: '17 13 * * *' # 07:17 GMT-6; primary daily observation.
    - cron: '57 21 * * *' # 15:57 GMT-6; daily backup. GitHub scheduling is best effort.
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [development, testing, production]
        default: production

permissions:
  contents: read

jobs:
  observe:
    if: (github.event_name == 'schedule' && github.ref_name == 'main') || (github.event_name == 'workflow_dispatch' && ((inputs.environment == 'production' && github.ref_name == 'main') || inputs.environment == github.ref_name))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: ${{ github.event_name == 'schedule' && 'production' || inputs.environment }}
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: sedepulso-pilot-${{ github.event_name == 'schedule' && 'production' || inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Identificar disparador de la observación
        run: node -e 'console.log(JSON.stringify({event:process.env.GITHUB_EVENT_NAME,schedule:process.env.PILOT_SCHEDULE || null}))'
        env:
          PILOT_SCHEDULE: ${{ github.event.schedule }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.PILOT_OBSERVER_ROLE_ARN }}
          aws-region: us-east-1
      - name: Observar sin modificar datos de operación
        run: node infra/tools/observe-pilot.mjs --environment "$PILOT_ENV"
        env:
          PILOT_ENV: ${{ github.event_name == 'schedule' && 'production' || inputs.environment }}
          PILOT_REPORT_BUCKET: ${{ vars.PILOT_REPORT_BUCKET }}
